[project]
name = "secuh"
version = "0.7.1"
description = "Sistema de detección de personas para videovigilancia"
# Sin `readme`: hatchling rechaza rutas fuera del directorio del proyecto
# (el README vive en la raíz del repo) y el paquete no se publica en PyPI.
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Diego Chavarro" }]
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "ultralytics>=8.2",
    # Declarados de forma explícita (aunque ultralytics ya los arrastra) para
    # que tool.uv.sources los redirija al índice CPU-only; uv no siempre
    # respeta la redirección de índice en dependencias puramente transitivas.
    "torch>=2.0",
    "torchvision>=0.15",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "requests>=2.32",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=4.0",
    "types-requests",
    "types-pyyaml",
    "httpx>=0.28",
]
spike = [
    "psutil>=6.0",
]
# Solo para analizar el histórico exportado (scripts/export_dataset.py y
# docs/analisis-de-datos.md). Nada del runtime depende de esto.
analysis = [
    "pandas>=2.2",
    "pyarrow>=17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------- torch (CPU)
# ultralytics arrastra torch/torchvision de forma transitiva. Sin fijar esto,
# la resolución en Linux baja el stack completo de CUDA de NVIDIA (~2.5 GB en
# paquetes nvidia-*/triton) aunque no haya GPU: este proyecto corre YOLO en
# CPU (ver ADR 0003). El índice CPU de PyTorch evita esa descarga por completo.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/secuh"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # reglas propias de ruff
]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["secuh"]

[[tool.mypy.overrides]]
module = ["cv2.*", "ultralytics.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: tests que requieren hardware o servicios externos (cámara, modelo YOLO)",
]

[tool.coverage.run]
source = ["src/secuh"]
