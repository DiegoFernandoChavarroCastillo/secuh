# Levanta el producto completo: PostgreSQL + backend + panel web.
#   cd deploy
#   cp .env.example .env   # y completar los secretos
#   docker compose up -d
#   Panel: http://localhost:8000 (usuario admin / SECUH_ADMIN_PASSWORD)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: secuh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir en .env}
      POSTGRES_DB: secuh
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secuh -d secuh"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECUH_DATABASE_URL: postgresql+psycopg://secuh:${POSTGRES_PASSWORD}@db:5432/secuh
      SECUH_SECRET_KEY: ${SECUH_SECRET_KEY:?definir en .env}
      SECUH_ADMIN_PASSWORD: ${SECUH_ADMIN_PASSWORD:?definir en .env}
      SECUH_NTFY_TOPIC: ${SECUH_NTFY_TOPIC:-}
      SECUH_CORS_ORIGINS: '["http://localhost:5173"]'
      # Ajustes operativos. Deben pasarse explícitamente: compose solo entrega
      # al contenedor las variables listadas aquí, no todo el .env. Los valores
      # por defecto son los de ServerSettings (backend/src/secuh/settings.py).
      # Documentados en docs/runbook.md §8.
      SECUH_RETENTION_DAYS: ${SECUH_RETENTION_DAYS:-7}
      SECUH_IMGSZ: ${SECUH_IMGSZ:-640}
      SECUH_CLIP_PRE_SECONDS: ${SECUH_CLIP_PRE_SECONDS:-10}
      SECUH_CLIP_POST_SECONDS: ${SECUH_CLIP_POST_SECONDS:-10}
      SECUH_SESSION_TTL_HOURS: ${SECUH_SESSION_TTL_HOURS:-12}
      # Anotación de escena (Fase 7): qué más se veía al detectar a la persona.
      SECUH_SCENE_ANNOTATION: ${SECUH_SCENE_ANNOTATION:-true}
      SECUH_SCENE_MIN_CONFIDENCE: ${SECUH_SCENE_MIN_CONFIDENCE:-0.25}
      SECUH_SCENE_DRAW_MIN_CONFIDENCE: ${SECUH_SCENE_DRAW_MIN_CONFIDENCE:-0.45}
      SECUH_SCENE_DRAW_LABELS: ${SECUH_SCENE_DRAW_LABELS:-[]}
      SECUH_KEEP_RAW_SNAPSHOT: ${SECUH_KEEP_RAW_SNAPSHOT:-true}
    ports:
      - "8000:8000"
    volumes:
      - secuh-data:/data
    healthcheck:
      # La imagen (python:3.12-slim) no trae curl ni wget: se usa el propio
      # intérprete del venv. start_period cubre migraciones + arranque.
      test:
        - CMD
        - .venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/api/health", timeout=5)
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  pgdata:
  secuh-data:
